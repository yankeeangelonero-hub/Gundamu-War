<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mech Bags 0.2</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260605-pickmovefix">
</head>
<body>
<div id="app">

  <!-- Header -->
  <header id="header">
    <h1>MECH BAGS</h1>
    <div class="run-stats">
      <span>Round <strong id="stat-round">1</strong></span>
      <span>Wins <strong id="stat-wins">0</strong></span>
      <span>Losses <strong id="stat-losses">0</strong></span>
      <span>Gold <strong id="gold-display">10</strong>g</span>
    </div>
  </header>

  <!-- Main: build board + side panel -->
  <div id="main">
    <div id="board-wrapper">
      <!-- Single canvas injected by app.js -->
      <div id="build-board"></div>
    </div>

    <div id="side-panel">
      <div class="panel-box">
        <h3>Hand</h3>
        <div id="hand-list"></div>
      </div>

      <div class="panel-box">
        <button id="rotate-btn" disabled>&#8635; Rotate (R)</button>
      </div>

      <div class="panel-box">
        <h3>Item Info</h3>
        <div id="info-box">Select an item to see details.</div>
      </div>

      <div class="panel-box" id="pilot-panel">
        <h3>Pilot</h3>
        <div id="pilot-info"><!-- rendered by app.js --></div>
      </div>
    </div>
  </div>

  <!-- Shop -->
  <div id="shop-area">
    <div id="shop-controls">
      <button class="ctrl-btn" id="reroll-btn">⟳ Reroll (1g)</button>
      <button class="ctrl-btn primary" id="deploy-btn">⚡ Deploy</button>
      <button class="ctrl-btn" id="battle-btn">⚔ Battle!</button>
    </div>
    <div id="shop-offers"><!-- rendered by app.js --></div>
  </div>

</div><!-- #app -->

<!-- Battle screen (fixed overlay) -->
<div id="battle-screen">
  <div id="battle-arena">

    <div class="combatant">
      <div class="combatant-label">YOUR MECH</div>
      <div class="mech-sprite" id="player-sprite">
        <div class="mech-head" data-anchor="head">👁</div>
        <div class="mech-torso" data-anchor="torso"></div>
        <div class="mech-arm left" data-anchor="leftArm"></div>
        <div class="mech-arm right" data-anchor="rightArm"></div>
        <div class="mech-back" data-anchor="back"></div>
      </div>
      <div class="hp-bar-wrap">
        <div class="hp-bar-label">
          <span>HP</span>
          <span id="player-hp-text">— / —</span>
        </div>
        <div class="hp-bar-bg">
          <div class="hp-bar-fill" id="player-hp-fill" style="width:100%"></div>
        </div>
      </div>
    </div>

    <div id="battle-center">
      <div id="event-banner">
        <div class="banner-main" id="banner-main">Ready…</div>
        <div class="banner-sub"  id="banner-sub"></div>
      </div>
      <div id="combat-log-wrap">
        <div id="combat-log"></div>
      </div>
      <div id="battle-bottom">
        <button class="ctrl-btn" id="leave-spectate-btn" style="display:none">← Leave Spectate</button>
        <button class="ctrl-btn" id="skip-btn">⏭ Skip Battle</button>
      </div>
    </div>

    <div class="combatant">
      <div class="combatant-label" id="enemy-name-label">ENEMY</div>
      <div class="mech-sprite" id="enemy-sprite">
        <div class="mech-head" data-anchor="head">☠</div>
        <div class="mech-torso" data-anchor="torso"></div>
        <div class="mech-arm left" data-anchor="leftArm"></div>
        <div class="mech-arm right" data-anchor="rightArm"></div>
        <div class="mech-back" data-anchor="back"></div>
      </div>
      <div class="hp-bar-wrap">
        <div class="hp-bar-label">
          <span>HP</span>
          <span id="enemy-hp-text">— / —</span>
        </div>
        <div class="hp-bar-bg">
          <div class="hp-bar-fill" id="enemy-hp-fill" style="width:100%"></div>
        </div>
      </div>
    </div>

  </div><!-- #battle-arena -->
</div><!-- #battle-screen -->

<!-- Battle result overlay -->
<div id="result-overlay">
  <div id="result-box">
    <div class="result-title" id="result-title">—</div>
    <div class="result-subtitle" id="result-subtitle"></div>
    <div class="result-highlights" id="result-highlights"></div>
    <button class="ctrl-btn primary" id="result-continue-btn">Continue →</button>
  </div>
</div>

<!-- Run end screen -->
<div id="run-end-screen">
  <div class="end-title" id="end-title">—</div>
  <div class="end-stats" id="end-stats"></div>
  <button class="ctrl-btn primary" id="new-run-btn">Start New Run</button>
</div>

<!-- Sortie screen — real-time theatre status -->
<div id="sortie-screen">
  <div id="sortie-inner">
    <div class="sortie-title">WAR THEATRE</div>
    <div class="sortie-subtitle" id="sortie-subtitle">Deploying…</div>

    <!-- Real-time phase status -->
    <div id="theatre-status">
      <div id="theatre-phase-label">—</div>
      <div id="theatre-progress-wrap">
        <div id="theatre-progress-bar"></div>
      </div>
    </div>

    <div id="sortie-fight-grid"><!-- fight chips rendered by app.js --></div>
    <div id="sortie-tally"><!-- wins / losses --></div>
    <div id="sortie-controls">
      <button class="ctrl-btn" id="spectate-btn">⚔ Spectate Last Fight</button>
      <button class="ctrl-btn primary" id="retreat-btn">↩ Retreat</button>
    </div>
  </div>
</div>

<!-- Retreat summary overlay -->
<div id="retreat-overlay">
  <div id="retreat-box">
    <div class="retreat-title">SORTIE COMPLETE</div>
    <div id="retreat-record"><!-- record --></div>
    <div id="retreat-loot"><!-- loot --></div>
    <div id="retreat-pilot"><!-- pilot changes --></div>
    <div id="retreat-learn"><!-- learning signal --></div>
    <button class="ctrl-btn primary" id="retreat-continue-btn">Back to Workshop →</button>
  </div>
</div>

<script src="game-core.js?v=20260605-pickmovefix"></script>
<script src="app.js?v=20260605-pickmovefix"></script>
</body>
</html>

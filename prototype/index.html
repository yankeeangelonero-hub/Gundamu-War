<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mech Bags 0.1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- Header -->
  <header id="header">
    <h1>MECH BAGS</h1>
    <div class="run-stats">
      <span>Round <strong id="stat-round">1</strong></span>
      <span>Wins <strong id="stat-wins" style="color:#44cc88">0</strong></span>
      <span>Losses <strong id="stat-losses" style="color:#ee4444">0</strong></span>
      <span>Gold <strong id="gold-display" style="color:#f5c518">10</strong>g</span>
    </div>
  </header>

  <!-- Main: build board + side panel -->
  <div id="main">
    <div style="flex:1;overflow-x:auto;display:flex;justify-content:center">
      <div id="build-board"><!-- bag panels injected by app.js --></div>
    </div>

    <div id="side-panel">
      <div class="panel-box">
        <h3>Hand</h3>
        <div id="hand-list"></div>
      </div>

      <div class="panel-box">
        <button id="rotate-btn" disabled>&#8635; Rotate (R)</button>
      </div>

      <div class="panel-box">
        <h3>Item Info</h3>
        <div id="info-box">Select an item to see details.</div>
      </div>
    </div>
  </div>

  <!-- Shop -->
  <div id="shop-area">
    <div id="shop-controls">
      <button class="ctrl-btn" id="reroll-btn">⟳ Reroll (1g)</button>
      <button class="ctrl-btn primary" id="battle-btn">⚔ Battle!</button>
    </div>
    <div id="shop-offers"><!-- rendered by app.js --></div>
  </div>

</div><!-- #app -->

<!-- Battle screen (fixed overlay) -->
<div id="battle-screen">
  <div id="battle-arena">

    <!-- Player combatant -->
    <div class="combatant">
      <div class="combatant-label">YOUR MECH</div>
      <div class="mech-sprite" id="player-sprite">
        <div class="mech-head" data-anchor="head">👁</div>
        <div class="mech-torso" data-anchor="torso"></div>
        <div class="mech-arm left" data-anchor="leftArm"></div>
        <div class="mech-arm right" data-anchor="rightArm"></div>
        <div class="mech-back" data-anchor="back"></div>
      </div>
      <div class="hp-bar-wrap">
        <div class="hp-bar-label">
          <span>HP</span>
          <span id="player-hp-text">— / —</span>
        </div>
        <div class="hp-bar-bg">
          <div class="hp-bar-fill" id="player-hp-fill" style="width:100%"></div>
        </div>
      </div>
    </div>

    <!-- Battle center -->
    <div id="battle-center">
      <div id="event-banner">
        <div class="banner-main" id="banner-main">Ready…</div>
        <div class="banner-sub"  id="banner-sub"></div>
      </div>
      <div id="combat-log-wrap">
        <div id="combat-log"></div>
      </div>
      <div id="battle-bottom">
        <button class="ctrl-btn" id="skip-btn" style="width:100%">⏭ Skip Battle</button>
      </div>
    </div>

    <!-- Enemy combatant -->
    <div class="combatant">
      <div class="combatant-label" id="enemy-name-label">ENEMY</div>
      <div class="mech-sprite" id="enemy-sprite">
        <div class="mech-head" data-anchor="head">☠</div>
        <div class="mech-torso" data-anchor="torso"></div>
        <div class="mech-arm left" data-anchor="leftArm"></div>
        <div class="mech-arm right" data-anchor="rightArm"></div>
        <div class="mech-back" data-anchor="back"></div>
      </div>
      <div class="hp-bar-wrap">
        <div class="hp-bar-label">
          <span>HP</span>
          <span id="enemy-hp-text">— / —</span>
        </div>
        <div class="hp-bar-bg">
          <div class="hp-bar-fill" id="enemy-hp-fill" style="width:100%"></div>
        </div>
      </div>
    </div>

  </div><!-- #battle-arena -->
</div><!-- #battle-screen -->

<!-- Battle result overlay -->
<div id="result-overlay">
  <div id="result-box">
    <div class="result-title" id="result-title">—</div>
    <div class="result-subtitle" id="result-subtitle"></div>
    <div class="result-highlights" id="result-highlights"></div>
    <button class="ctrl-btn primary" id="result-continue-btn" style="width:100%">Continue →</button>
  </div>
</div>

<!-- Run end screen -->
<div id="run-end-screen">
  <div class="end-title" id="end-title">—</div>
  <div class="end-stats" id="end-stats"></div>
  <button class="ctrl-btn primary" id="new-run-btn" style="min-width:160px;padding:12px 20px;font-size:14px">Start New Run</button>
</div>

<script src="game-core.js"></script>
<script src="app.js"></script>
</body>
</html>
